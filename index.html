<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Club Event Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">🦆</div>
      <div>
        <h1>Duck Club</h1>
        <p>Event Dashboard</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <div>
        <p class="eyebrow">EVENT MANAGEMENT</p>
        <h2>Your Events</h2>
        <p class="intro">Track paperwork, equipment, people, payments and everything else needed to make your event ready.</p>
      </div>
      <button class="primary-button" id="addEventButton">+ Add New Event</button>
    </section>

    <section id="eventsGrid" class="events-grid"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
