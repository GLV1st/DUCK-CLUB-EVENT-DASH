<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Club Event Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">🦆</div>
        <div>
          <h1>Duck Club</h1>
          <p>Event Dashboard</p>
        </div>
      </div>
      <div class="header-status" id="apiStatus">Checking API…</div>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <div>
        <p class="eyebrow">EVENT MANAGEMENT</p>
        <h2>Event Dashboard</h2>
        <p class="intro">Track paperwork, equipment, people, payments and everything needed to make each event ready.</p>
      </div>
      <button class="primary-button" id="addEventButton">+ Add New Event</button>
    </section>

    <section id="eventTabs" class="event-tabs"></section>

    <section id="eventPanel" class="event-panel"></section>
  </main>

  <div id="modalRoot"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
